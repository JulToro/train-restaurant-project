[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
; Enviar comandos completos al pulsar Enter. No mostrar lo escrito (incluye claves).
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = LF
; Sin puerto fijo: permite detectar el ESP32 aunque cambie el nombre del puerto USB.
